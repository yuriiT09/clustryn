name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Display Go version
        run: go version

- name: Run go vet
  shell: bash
  run: |
    packages="$(go list ./... 2>/dev/null || true)"
    if [ -z "$packages" ]; then
      echo "No Go packages yet; skipping go vet."
      exit 0
    fi
    go vet ./...

- name: Run tests
  shell: bash
  run: |
    packages="$(go list ./... 2>/dev/null || true)"
    if [ -z "$packages" ]; then
      echo "No Go packages yet; skipping tests."
      exit 0
    fi
    go test ./...